<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istočna Srbija</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        .popup-img { max-width: 250px; border-radius: 6px; }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Инициализация карты
    var map = L.map('map').setView([43.893934, 22.104492], 9);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Иконки
    const krst = L.icon({ iconUrl: 'icons/Christianity-orthodoxcross-bold-400w.png', iconSize: [26,26], iconAnchor:[13,13], popupAnchor:[0,-30] });
    const musliman = L.icon({ iconUrl: 'icons/bracamuslimani.png', iconSize: [26,26], iconAnchor:[13,13], popupAnchor:[0,-30] });
    const kampf = L.icon({ iconUrl: 'icons/sportskicentar.png', iconSize: [50,26], iconAnchor:[13,13], popupAnchor:[15,-40] });
    const spomenici = L.icon({ iconUrl: 'icons/Museum_Icon_local.png', iconSize: [26,26], iconAnchor:[13,13], popupAnchor:[0,-30] });

    // --- Цркве и манастири ---
    L.marker([43.542532,21.707719],{icon:krst}).addTo(map).bindPopup("<b>Crkva Svetog Nikole, Aleksinac</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=3a12c9b42fc20cd43c02731d643d909d98a90ce7-5232177-images-thumbs&n=13'>");
    L.marker([43.218967,22.312041],{icon:krst}).addTo(map).bindPopup("<b>Crkva Vaznesenja</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=72f0e767afd68f0bdde594cfda1760cdd21a437a-5309715-images-thumbs&n=13'>");
    L.marker([43.186707,22.292984],{icon:krst}).addTo(map).bindPopup("<b>Crkva Svetog Dimitrija</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=f49ede990754a79a86b5c83b5d9397c5260989eb-16401557-images-thumbs&n=13'>");
    L.marker([43.014773,22.779503],{icon:krst}).addTo(map).bindPopup("<b>Crkva Rođenja Presvete Bogorodice</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=f69421aaa1dc0c57c6c00dd159f7a366_sr-5858200-images-thumbs&n=13'>");
    L.marker([43.140104,21.276944],{icon:krst}).addTo(map).bindPopup("<b>Manastir Svetog Nikole, Kuršumlija</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=b01b3fb59678236b924739d338b4b9813e9bb298-3237927-images-thumbs&n=13'>");
    L.marker([42.918401,21.736367],{icon:krst}).addTo(map).bindPopup("<b>Crkva Усековања главе Svetog Jovana, Lebane</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=2e5601eb11296d59e7a69df457bf0911b9e15251-7011986-images-thumbs&n=13'>");
    L.marker([43.095954,22.047358],{icon:krst}).addTo(map).bindPopup("<b>Јашуњски manastir Svetog Jovana</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=079a8edd555b4488f4d7b6f7037fee2bb0419c37-12384307-images-thumbs&n=13'>");
    L.marker([43.156547,22.587582],{icon:krst}).addTo(map).bindPopup("<b>Crkva Rođenja Hristovog, Pirot</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=a661cdf00ba619ca68adcd7585bc2ee07c0b3047-8075965-images-thumbs&n=13'>");

    // --- Џамије ---
    L.marker([43.320533,21.893174],{icon:musliman}).addTo(map).bindPopup("<b>Džamija Islama Agi</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=b90fa6bb65bb992787a3d49439de478c7c65aab1-10933600-images-thumbs&n=13'>");
    L.marker([42.460309,21.761646],{icon:musliman}).addTo(map).bindPopup("<b>Dženet Džamija</b><br><img class='popup-img' src='https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Local_Mosque_example.jpg/250px-Local_Mosque_example.jpg'>");

    // --- Спортски центри ---
    L.marker([44.655258,22.537913],{icon:kampf}).addTo(map).bindPopup("<b>Sportski kamp KaraTaš</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=ecd133990065942fa41f67c633a9184155dd11e4-12496051-images-thumbs&n=13'>");
    L.marker([44.619324,21.173681],{icon:kampf}).addTo(map).bindPopup("<b>Sportski centar Požarevac</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=e73b01e714c89a88392b80f133a68f53d8bdabc5-8310741-images-thumbs&n=13'>");
    L.marker([43.314216,21.908180],{icon:kampf}).addTo(map).bindPopup("<b>Sportski centar Čair</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=fd30f2f9b38fc69f8dd5efec85bc01d4b09ee7be-5338789-images-thumbs&n=13'>");
    L.marker([43.369547,22.608863],{icon:kampf}).addTo(map).bindPopup("<b>Stara planina</b><br><img class='popup-img' src='https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Stara_planina_example.jpg/250px-Stara_planina_example.jpg'>");

    // --- Споменици ---
    L.marker([43.011431,21.409060],{icon:spomenici}).addTo(map).bindPopup("<b>Đavolja Varoš</b><br><img class='popup-img' src='https://avatars.mds.yandex.net/i?id=40c448e46bdbfb7b9ab33dd681a7f2450727f42e-6251463-images-thumbs&n=13'>");
</script>

</body>
</html>
